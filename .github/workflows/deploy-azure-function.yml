name: Deploy Azure Function

on:
  push:
    branches: [main]
    paths:
      - "azure-functions/**"
      - ".github/workflows/deploy-azure-function.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 20.x

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: azure-functions/package-lock.json

      - name: Install function dependencies
        working-directory: azure-functions
        run: npm ci --omit=dev

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: azure-functions
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          app-settings: |
            COSMOS_DB_CONNECTION_STRING=${{ secrets.COSMOS_DB_CONNECTION_STRING }}
            COSMOS_DB_DATABASE=${{ vars.COSMOS_DB_DATABASE }}
            AzureWebJobsStorage=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
